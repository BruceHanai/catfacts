name: Send Cat Facts

on:
  workflow_dispatch:

  schedule:
    - cron: '54 12 * * *'
      timezone: "America/Los_Angeles"

jobs:
  send-cat-facts:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Twilio signature and invoke protected Function
        env:
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          FUNCTION_URL: https://call-screen-9466.twil.io/send-cat-facts
        run: |
          SIGNATURE=$(python3 - <<'PY'
          import os
          import hmac
          import hashlib
          import base64

          url = os.environ["FUNCTION_URL"]
          token = os.environ["TWILIO_AUTH_TOKEN"].encode()

          signature = base64.b64encode(
              hmac.new(token, url.encode(), hashlib.sha1).digest()
          ).decode()

          print(signature)
          PY
          )

          curl --fail \
            -H "X-Twilio-Signature: $SIGNATURE" \
            "$FUNCTION_URL"
